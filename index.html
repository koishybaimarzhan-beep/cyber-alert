<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SafeMessage AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #eff6ff);
    min-height: 100vh;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 25px;
}

h1 {
    text-align: center;
    color: #172554;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 20px;
}

.box {
    background: white;
    padding: 22px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.10);
    margin-top: 20px;
}

textarea {
    width: 100%;
    height: 160px;
    padding: 15px;
    border: 2px solid #cbd5e1;
    border-radius: 14px;
    font-size: 16px;
    resize: vertical;
    outline: none;
}

textarea:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.check {
    background: #172554;
    color: white;
}

.check:hover {
    background: #1e40af;
}

.clear {
    background: #e2e8f0;
}

.clear:hover {
    background: #cbd5e1;
}

#result {
    display: none;
}

#status {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
}

.score {
    text-align: center;
    font-size: 20px;
}

.progress {
    width: 100%;
    height: 18px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
    margin: 15px 0;
}

#progressBar {
    height: 100%;
    width: 0%;
    transition: 0.5s;
}

.danger {
    color: #dc2626;
}

.warning {
    color: #ea580c;
}

.safe {
    color: #16a34a;
}

.danger-bg {
    background: #dc2626;
}

.warning-bg {
    background: #ea580c;
}

.safe-bg {
    background: #16a34a;
}

.reason {
    background: #f8fafc;
    padding: 12px;
    margin-top: 8px;
    border-radius: 10px;
    border-left: 5px solid #2563eb;
}

.advice {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    background: #eff6ff;
    color: #1e3a8a;
    font-weight: bold;
}

.examples {
    margin-top: 20px;
}

.example {
    padding: 12px;
    margin-top: 8px;
    border-radius: 10px;
    cursor: pointer;
    background: #f1f5f9;
}

.example:hover {
    background: #e2e8f0;
}

.footer {
    text-align: center;
    color: #64748b;
    margin-top: 20px;
    font-size: 13px;
}

</style>
</head>

<body>

<div class="container">

<h1>🛡️ SafeMessage</h1>

<div class="subtitle">
SMS және хабарламалардың қауіп деңгейін анықтау
</div>


<div class="box">

<h3>📩 Хабарламаны енгізіңіз</h3>

<textarea
id="message"
placeholder="Мысалы: Сіз 100 000 теңге ұтып алдыңыз! Қазір сілтемеге өтіп, карта нөмірін енгізіңіз..."
></textarea>

<button class="check" onclick="checkMessage()">
🔍 ХАБАРЛАМАНЫ ТЕКСЕРУ
</button>

<button class="clear" onclick="clearMessage()">
🗑️ ТАЗАЛАУ
</button>

</div>


<div class="box examples">

<h3>🧪 Тест үшін мысалдар</h3>

<div class="example"
onclick="useExample(1)">
🔴 Қауіпті SMS мысалы
</div>

<div class="example"
onclick="useExample(2)">
🟠 Күмәнді SMS мысалы
</div>

<div class="example"
onclick="useExample(3)">
🟢 Қауіпсіз SMS мысалы
</div>

</div>


<div class="box" id="result">

<div id="status"></div>

<div class="score">
Тәуекел деңгейі:
<b><span id="score">0</span>/100</b>
</div>

<div class="progress">
<div id="progressBar"></div>
</div>

<h3>🔎 Анықталған белгілер:</h3>

<div id="reasons"></div>

<div class="advice" id="advice"></div>

</div>


<div class="footer">
SafeMessage — цифрлық қауіпсіздікке арналған оқу жобасы
</div>

</div>


<script>

function checkMessage() {

    var message =
        document.getElementById("message").value.toLowerCase();

    if (message.trim() === "") {

        alert("Алдымен хабарламаны енгізіңіз!");

        return;
    }


    var score = 0;

    var reasons = [];


    /*
    =================================
    1. АҚША / СЫЙЛЫҚ
    =================================
    */

    var moneyWords = [

        "сыйлық",
        "жүлде",
        "сыйақы",
        "бонус",
        "ақша аласыз",
        "ақша беріледі",
        "ақша ұттыңыз",
        "ұтып алдыңыз",
        "қаражат алыңыз",
        "миллион",
        "100 000",
        "500 000"

    ];

    if (containsAny(message, moneyWords)) {

        score += 20;

        reasons.push(
            "💰 Күтпеген ақша немесе сыйлық туралы ұсыныс бар."
        );
    }


    /*
    =================================
    2. СІЛТЕМЕ
    =================================
    */

    if (
        message.includes("http://") ||
        message.includes("https://") ||
        message.includes("www.") ||
        message.includes(".com/") ||
        message.includes(".ru/")
    ) {

        score += 25;

        reasons.push(
            "🔗 Хабарламада интернет-сілтеме бар."
        );
    }


    /*
    =================================
    3. КАРТА ДЕРЕКТЕРІ
    =================================
    */

    var cardWords = [

        "карта нөмірі",
        "карта номері",
        "карта нөмері",
        "банк картасы",
        "cvv",
        "cvc",
        "карта деректері"

    ];

    if (containsAny(message, cardWords)) {

        score += 35;

        reasons.push(
            "💳 Банк картасының деректері сұралған."
        );
    }


    /*
    =================================
    4. SMS КОД
    =================================
    */

    var codeWords = [

        "sms код",
        "смс код",
        "растау коды",
        "кодты енгізіңіз",
        "кодты жіберіңіз",
        "бір реттік код",
        "otp"

    ];

    if (containsAny(message, codeWords)) {

        score += 35;

        reasons.push(
            "🔐 SMS немесе растау коды сұралған."
        );
    }


    /*
    =================================
    5. ҚҰПИЯСӨЗ
    =================================
    */

    var passwordWords = [

        "пароль",
        "құпиясөз",
        "логин",
        "құпия код",
        "аккаунтқа кіріңіз"

    ];

    if (containsAny(message, passwordWords)) {

        score += 30;

        reasons.push(
            "🔑 Логин немесе құпиясөз сұралған."
        );
    }


    /*
    =================================
    6. ЖСН
    =================================
    */

    var personalWords = [

        "жсн",
        "иин",
        "жеке куәлік",
        "құжат нөмірі",
        "паспорт",
        "мекенжай"

    ];

    if (containsAny(message, personalWords)) {

        score += 30;

        reasons.push(
            "🪪 Жеке деректер сұралған."
        );
    }


    /*
    =================================
    7. АСЫҚТЫРУ
    =================================
    */

    var urgencyWords = [

        "шұғыл",
        "тез арада",
        "қазір",
        "бірден",
        "10 минут",
        "5 минут",
        "дереу",
        "бүгін ғана",
        "соңғы мүмкіндік",
        "аккаунтыңыз жабылады"

    ];

    if (containsAny(message, urgencyWords)) {

        score += 20;

        reasons.push(
            "⚠️ Асықтыру немесе қорқыту белгісі бар."
        );
    }


    /*
    =================================
    8. ҚОРҚЫТУ
    =================================
    */

    var threatWords = [

        "бұғатталады",
        "жабылады",
        "айыппұл",
        "сот",
        "қарыз",
        "төлем жасаңыз",
        "аккаунтыңыз тоқтатылады"

    ];

    if (containsAny(message, threatWords)) {

        score += 20;

        reasons.push(
            "🚨 Қорқыту немесе қысым көрсету белгісі бар."
        );
    }


    /*
    =================================
    9. ЖАЛҒАН ЖЕҢІМПАЗ
    =================================
    */

    var winnerWords = [

        "жеңімпаз",
        "ұтыс",
        "лотерея",
        "сіз жеңдіңіз",
        "құттықтаймыз",
        "приз",
        "сыйлық ұтып алдыңыз"

    ];

    if (containsAny(message, winnerWords)) {

        score += 20;

        reasons.push(
            "🎁 Күтпеген ұтыс немесе жеңіс туралы хабарлама бар."
        );
    }


    /*
    =================================
    10. РЕСМИ БОЛЫП КӨРІНУ
    =================================
    */

    var officialWords = [

        "банк қызметкері",
        "қауіпсіздік бөлімі",
        "әкімшілік",
        "полициядан",
        "салық органынан",
        "қолдау қызметі"

    ];

    if (containsAny(message, officialWords)) {

        score += 10;

        reasons.push(
            "🏦 Хабарлама өзін ресми ұйым ретінде көрсетуі мүмкін."
        );
    }


    /*
    =================================
    SCORE 100
    =================================
    */

    if (score > 100) {

        score = 100;

    }


    /*
    =================================
    НӘТИЖЕ
    =================================
    */

    var result =
        document.getElementById("result");

    var status =
        document.getElementById("status");

    var progressBar =
        document.getElementById("progressBar");

    result.style.display = "block";

    document.getElementById("score").innerHTML = score;

    progressBar.style.width = score + "%";


    /*
    =================================
    ҚАУІП ДЕҢГЕЙІ
    =================================
    */

    if (score >= 60) {

        status.innerHTML = "🔴 ҚАУІПТІ";

        status.className = "danger";

        progressBar.className = "danger-bg";

        document.getElementById("advice").innerHTML =
            "⛔ Бұл хабарламада қауіпті белгілер көп. " +
            "Сілтемеге өтпеңіз, код немесе банк деректерін енгізбеңіз.";

    }

    else if (score >= 30) {

        status.innerHTML = "🟠 КҮМӘНДІ";

        status.className = "warning";

        progressBar.className = "warning-bg";

        document.getElementById("advice").innerHTML =
            "⚠️ Хабарламада күмәнді белгілер бар. " +
            "Ақпаратты ресми дереккөз арқылы тексеріңіз.";

    }

    else {

        status.innerHTML = "🟢 ҚАУІПСІЗ";

        status.className = "safe";

        progressBar.className = "safe-bg";

        document.getElementById("advice").innerHTML =
            "✅ Күмәнді белгілер анықталмады. " +
            "Дегенмен бейтаныс адамға жеке деректеріңізді бермеңіз.";

    }


    /*
    =================================
    СЕБЕПТЕР
    =================================
    */

    var reasonsBox =
        document.getElementById("reasons");

    reasonsBox.innerHTML = "";


    if (reasons.length === 0) {

        reasonsBox.innerHTML =
            '<div class="reason">' +
            '✅ Қауіпті белгілер анықталған жоқ.' +
            '</div>';

    }

    else {

        for (
            var i = 0;
            i < reasons.length;
            i++
        ) {

            reasonsBox.innerHTML +=
                '<div class="reason">' +
                reasons[i] +
                '</div>';

        }

    }

}


/*
=================================
КӨМЕКШІ ФУНКЦИЯ
=================================
*/

function containsAny(text, words) {

    for (
        var i = 0;
        i < words.length;
        i++
    ) {

        if (text.includes(words[i])) {

            return true;

        }

    }

    return false;
}


/*
=================================
ТАЗАЛАУ
=================================
*/

function clearMessage() {

    document.getElementById("message").value = "";

    document.getElementById("result").style.display = "none";

}


/*
=================================
ДАЙЫН МЫСАЛДАР
=================================
*/

function useExample(number) {

    var message =
        document.getElementById("message");


    if (number === 1) {

        message.value =
        "Құттықтаймыз! Сіз 500 000 теңге ұтып алдыңыз! " +
        "Сыйлықты алу үшін қазір https://example.com сайтына өтіп, " +
        "карта нөмірін және SMS кодты енгізіңіз.";

    }


    if (number === 2) {

        message.value =
        "Сіздің аккаунтыңыз бұғатталуы мүмкін. " +
        "Қазір қауіпсіздік бөлімінен келген сілтемені тексеріңіз.";

    }


    if (number === 3) {

        message.value =
        "Сәлем! Ертең информатика сабағы сағат 10:00-де басталады. " +
        "Оқулықтарыңызды алып келіңіздер.";

    }

}

</script>

</body>
</html>
