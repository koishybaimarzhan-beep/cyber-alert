<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Alert</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
    color: #222;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    color: #1769aa;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

textarea {
    width: 100%;
    height: 170px;
    padding: 15px;
    font-size: 16px;
    border: 2px solid #ccd8e5;
    border-radius: 12px;
    resize: vertical;
    outline: none;
}

textarea:focus {
    border-color: #1769aa;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    color: white;
}

.check {
    background: #1769aa;
}

.clear {
    background: #777;
}

.test {
    background: #607d8b;
    width: 100%;
    margin-top: 8px;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
}

.danger {
    background: #ffe1e1;
    border: 2px solid #e53935;
}

.suspicious {
    background: #fff0d5;
    border: 2px solid #ff9800;
}

.safe {
    background: #ddf7e4;
    border: 2px solid #2e7d32;
}

.status {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 15px;
}

.reason {
    background: white;
    padding: 10px;
    margin-top: 7px;
    border-radius: 8px;
}

.test-box {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px solid #eee;
}

.test-box h2 {
    color: #1769aa;
}

footer {
    text-align: center;
    color: #777;
    margin-top: 20px;
    font-size: 13px;
}

@media(max-width:600px) {
    .container {
        margin: 10px auto;
    }

    .card {
        padding: 18px;
    }

    .buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🔐 CYBER ALERT</h1>

<div class="subtitle">
Күмәнді хабарламаларды автоматты түрде тексеру
</div>

<textarea id="message"
placeholder="Хабарламаны осы жерге жазыңыз немесе көшіріп қойыңыз..."></textarea>

<div class="buttons">

<button class="check" onclick="checkMessage()">
🔍 Хабарламаны тексеру
</button>

<button class="clear" onclick="clearMessage()">
🗑️ Тазалау
</button>

</div>

<div id="result"></div>


<div class="test-box">

<h2>🧪 Тест</h2>

<button class="test" onclick="testDanger()">
🔴 Қауіпті мысал
</button>

<button class="test" onclick="testBank()">
💳 Банк туралы мысал
</button>

<button class="test" onclick="testPrize()">
🎁 Ұтыс туралы мысал
</button>

<button class="test" onclick="testSafe()">
🟢 Қауіпсіз мысал
</button>

</div>

</div>

<footer>
© 2026 Cyber Alert
</footer>

</div>


<script>

function checkMessage() {

    const text = document
        .getElementById("message")
        .value
        .trim();

    const result = document.getElementById("result");

    if (text === "") {

        result.style.display = "block";
        result.className = "suspicious";

        result.innerHTML = `
            <div class="status">⚠️ Мәтін енгізіңіз</div>
        `;

        return;
    }

    const lower = text.toLowerCase();

    let score = 0;
    let reasons = [];


    /* =========================
       1. СІЛТЕМЕЛЕР
       ========================= */

    if (
        /(https?:\/\/|www\.|t\.me\/|bit\.ly\/|tinyurl\.com|goo\.gl|wa\.me\/|telegram\.me\/)/i
        .test(text)
    ) {

        score += 6;

        reasons.push(
            "🔗 Сілтеме анықталды"
        );
    }


    /* =========================
       2. БАНК КАРТАСЫ
       ========================= */

    const cardRegex = /\b(?:\d[ -]*?){13,19}\b/;

    if (cardRegex.test(text)) {

        score += 7;

        reasons.push(
            "💳 Банк картасының нөмірі анықталды"
        );
    }


    /* =========================
       3. CVV / CVC
       ========================= */

    if (
        /(cvv|cvc|қауіпсіздік коды|код безопасности|код карты)/i
        .test(lower)
    ) {

        score += 7;

        reasons.push(
            "🔐 CVV/CVC немесе карта қауіпсіздік коды туралы ақпарат анықталды"
        );
    }


    /* =========================
       4. ҚҰПИЯСӨЗ / LOGIN
       ========================= */

    if (
        /(пароль|пароліңіз|пароля|құпиясөз|құпия сөз|логин|login|password|құпия код)/i
        .test(lower)
    ) {

        score += 5;

        reasons.push(
            "🔑 Құпиясөз немесе логин туралы ақпарат анықталды"
        );
    }


    /* =========================
       5. БАНК
       ========================= */

    if (
        /(банк|банковский|банковская|банк қызметкері|банк сотрудник|банк қызметкеріміз|банковские данные)/i
        .test(lower)
    ) {

        score += 4;

        reasons.push(
            "🏦 Банкке қатысты күмәнді сөз анықталды"
        );
    }


    /* =========================
       6. КАРТА
       ========================= */

    if (
        /(банк картасы|карта нөмірі|номер карты|банковская карта|картаңызды|картаңызды енгіз|карта деректері|карта данные)/i
        .test(lower)
    ) {

        score += 5;

        reasons.push(
            "💳 Банк картасының деректері туралы сөз анықталды"
        );
    }


    /* =========================
       7. АҚША
       ========================= */

    if (
        /(ақша|теңге|тенге|₸|доллар|рубль|евро|миллион|миллиард|қаржы|қаржылық|деньги|денег|финансы|финансовый|финансовая|получить деньги)/i
        .test(lower)
    ) {

        score += 3;

        reasons.push(
            "💰 Ақша немесе қаржы туралы сөз анықталды"
        );
    }


    /* =========================
       8. ҰТЫС / ЖҮЛДЕ
       ========================= */

    if (
        /(ұтып алдыңыз|ұтып алдың|ұтыс|ұтыс ойыны|жүлде|сыйлық|сыйлық ұтып|жеңімпаз|жеңдіңіз|лотерея|приз|вы выиграли|выиграли|выигрыш|подарок|победитель|победили|лотерея)/i
        .test(lower)
    ) {

        score += 5;

        reasons.push(
            "🎁 Ұтыс, жүлде немесе сыйлық туралы сөз анықталды"
        );
    }


    /* =========================
       9. АҚША АЛУ / АУДАРУ
       ========================= */

    if (
        /(ақша алыңыз|ақша алуға|ақшаңызды алыңыз|ақша аударыңыз|ақша аудару|төлем жасаңыз|төлем жаса|төлеуіңіз керек|переведите деньги|перевод денег|оплатите|оплату|получите деньги|заберите деньги)/i
        .test(lower)
    ) {

        score += 5;

        reasons.push(
            "💸 Ақша аудару немесе төлем жасауға шақыру анықталды"
        );
    }


    /* =========================
       10. ШҰҒЫЛДЫҚ
       ========================= */

    if (
        /(шұғыл|жедел|тез|қазір|дәл қазір|бірден|соңғы мүмкіндік|уақыт аз|срочно|немедленно|сейчас|прямо сейчас|быстро|последний шанс|времени мало)/i
        .test(lower)
    ) {

        score += 3;

        reasons.push(
            "⏰ Шұғыл әрекет жасауға қысым көрсетілген"
        );
    }


    /* =========================
       11. АККАУНТ БҰҒАТТАУ
       ========================= */

    if (
        /(аккаунт бұғатталады|аккаунтыңыз бұғатталады|аккаунт бұғатталды|аккаунтыңыз бұғатталды|есептік жазба бұғатталады|профиль бұғатталады|заблокируют аккаунт|аккаунт заблокирован|аккаунт будет заблокирован|страница заблокирована|профиль заблокирован)/i
        .test(lower)
    ) {

        score += 5;

        reasons.push(
            "🚫 Аккаунтты бұғаттау туралы қорқыту анықталды"
        );
    }


    /* =========================
       12. ФИШИНГ
       ========================= */

    if (
        /(фишинг|фишинговый|жалған сайт|жалған сілтеме|поддельный сайт|фальшивый сайт|қауіпсіздік тексеруі|проверка безопасности|растау қажет|нужно подтвердить|подтвердите аккаунт)/i
        .test(lower)
    ) {

        score += 5;

        reasons.push(
            "🎣 Фишингке тән белгі анықталды"
        );
    }


    /* =========================
       13. ЖЕКЕ ДЕРЕКТЕР
       ========================= */

    if (
        /(жеке деректер|жеке мәлімет|жеке ақпарат|персональные данные|личные данные|личная информация|жеке куәлік|удостоверение личности|паспорт|құжат нөмірі|номер документа)/i
        .test(lower)
    ) {

        score += 4;

        reasons.push(
            "🪪 Жеке деректерді сұрауға қатысты белгі анықталды"
        );
    }


    /* =========================
       14. ТЕЛЕФОН / НӨМІР
       ========================= */

    if (
        /(телефон нөмірі|номер телефона|телефон номер|нөміріңіз|ваш номер|телефонды жібер|телефонды жазыңыз)/i
        .test(lower)
    ) {

        score += 3;

        reasons.push(
            "📱 Телефон нөміріне қатысты белгі анықталды"
        );
    }


    /* =========================
       15. БОНУС / СЫЙАҚЫ
       ========================= */

    if (
        /(бонус|бонустар|сыйақы|ақшалай сыйлық|премия|компенсация|өтемақы|компенсация получите|бонус получите)/i
        .test(lower)
    ) {

        score += 3;

        reasons.push(
            "🎉 Бонус немесе қаржылық сыйақы туралы белгі анықталды"
        );
    }


    /* =========================
       16. САЛЫҚ / ПОЛИЦИЯ / РЕСМИ ҚЫЗМЕТ
       ========================= */

    if (
        /(полиция|салық қызметі|салық басқармасы|налоговая|полиция сообщает|прокуратура|қауіпсіздік қызметі|служба безопасности|мемлекеттік қызмет|государственная служба)/i
        .test(lower)
    ) {

        score += 4;

        reasons.push(
            "👤 Ресми мекеме немесе қауіпсіздік қызметі атынан хабарлама белгісі анықталды"
        );
    }


    /* =========================
       17. ӘРЕКЕТ ЖАСАУҒА ШАҚЫРУ
       ========================= */

    if (
        /(енгізіңіз|енгіз|жазыңыз|жіберіңіз|жібер|айтыңыз|беріңіз|толтырыңыз|растаңыз|тексеріңіз|ашыңыз|басыңыз|введите|введи|отправьте|отправь|сообщите|скажите|предоставьте|заполните|подтвердите|проверьте|откройте|нажмите)/i
        .test(lower)
    ) {

        score += 2;

        reasons.push(
            "👉 Белгілі бір әрекетті орындауға шақыру анықталды"
        );
    }


    /* =========================
       НӘТИЖЕ
       ========================= */

    let status;
    let className;
    let advice;


    if (score >= 6) {

        status = "🔴 ҚАУІПТІ";

        className = "danger";

        advice =
        "Жеке деректерді бермеңіз, ақша аудармаңыз және күмәнді сілтемеге өтпеңіз.";

    }

    else if (score >= 3) {

        status = "🟠 КҮМӘНДІ";

        className = "suspicious";

        advice =
        "Хабарламаны мұқият тексеріңіз. Жеке ақпаратты бермес бұрын ақпарат көзін анықтаңыз.";

    }

    else {

        status = "🟢 ҚАУІПСІЗ";

        className = "safe";

        advice =
        "Айқын қауіпті белгі анықталған жоқ.";

    }


    let reasonsHTML = "";

    if (reasons.length > 0) {

        reasonsHTML = `
            <h3>🔎 Анықталған белгілер</h3>
        `;

        reasons.forEach(function(reason) {

            reasonsHTML += `
                <div class="reason">
                    ${reason}
                </div>
            `;

        });

    }

    else {

        reasonsHTML = `
            <h3>🔎 Анықталған белгілер</h3>

            <div class="reason">
                ✅ Қауіпті белгі анықталған жоқ
            </div>
        `;

    }


    result.style.display = "block";

    result.className = className;

    result.innerHTML = `

        <div class="status">
            ${status}
        </div>

        ${reasonsHTML}

        <h3>💡 Ұсыныс</h3>

        <div class="reason">
            ${advice}
        </div>

    `;
}


/* ТАЗАЛАУ */

function clearMessage() {

    document.getElementById("message").value = "";

    document.getElementById("result").style.display = "none";
}


/* =========================
   ТЕСТ 1
   ========================= */

function testDanger() {

    document.getElementById("message").value =
    "Сіз 500 000 теңге ұтып алдыңыз! Сыйлықты алу үшін https://example.com сайтына өтіп, карта нөміріңізді және CVV кодты енгізіңіз.";

    checkMessage();
}


/* =========================
   ТЕСТ 2
   ========================= */

function testBank() {

    document.getElementById("message").value =
    "Банк қызметкеріміз. Аккаунтыңыз бұғатталмауы үшін карта нөміріңізді және құпиясөзіңізді енгізіңіз.";

    checkMessage();
}


/* =========================
   ТЕСТ 3
   ========================= */

function testPrize() {

    document.getElementById("message").value =
    "Құттықтаймыз! Сіз жүлде ұтып алдыңыз. Ақшаны алу үшін қазір төлем жасаңыз.";

    checkMessage();
}


/* =========================
   ТЕСТ 4
   ========================= */

function testSafe() {

    document.getElementById("message").value =
    "Сәлеметсіз бе! Ертең сағат 10:00-де ата-аналар жиналысы болады.";

    checkMessage();
}

</script>

</body>
</html>
